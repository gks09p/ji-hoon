<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>단어 블록 월드</title>
<style>
:root{--blue:#00a2ff;--green:#02b757;--red:#e2231a;--yellow:#f5cd30;--dark:#1b2a34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:900;color:#fff}
body{background:linear-gradient(#4fb0ff,#a8e0ff 60%,#d6f1ff)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.base{position:absolute;left:0;right:0;bottom:0;height:20%;background:repeating-conic-gradient(#3fae4a 0 25%,#4cc458 0 50%) 0 0/64px 64px;border-top:6px solid #2c8a37;pointer-events:none}
.btn{border:4px solid #111;border-radius:12px;padding:14px 22px;font:inherit;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);background:var(--blue);box-shadow:0 6px 0 #0a5f99,0 8px 0 #111;cursor:pointer;position:relative}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0a5f99,0 3px 0 #111}
.btn.g{background:var(--green);box-shadow:0 6px 0 #027a3a,0 8px 0 #111}
.btn.g:active{box-shadow:0 1px 0 #027a3a,0 3px 0 #111}
.btn.r{background:var(--red);box-shadow:0 6px 0 #9b1710,0 8px 0 #111}
.btn.y{background:var(--yellow);color:#222;text-shadow:none;box-shadow:0 6px 0 #b0900c,0 8px 0 #111}
.btn.sm{padding:6px 12px;font-size:18px;box-shadow:0 4px 0 #0a5f99,0 6px 0 #111}
/* home */
#home{align-items:center;justify-content:flex-start;gap:10px;padding:10px;overflow-y:auto}
.homebox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(560px,94vw)}
.title{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tb{display:inline-block;width:clamp(44px,9vw,64px);height:clamp(44px,9vw,64px);line-height:clamp(38px,8vw,58px);text-align:center;font-size:clamp(28px,6vw,42px);background:var(--c);border:4px solid #111;border-radius:8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.35),0 5px 0 #111;text-shadow:0 3px 0 rgba(0,0,0,.35);animation:bob 2s ease-in-out infinite;animation-delay:var(--d)}
.tb.sp{visibility:hidden;width:16px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub{background:#111;border-radius:8px;padding:6px 16px;font-size:20px;color:var(--yellow)}
.menu{display:flex;flex-direction:column;gap:14px;width:100%}
.menu .btn{font-size:26px;padding:16px;text-align:center}
.menu small{display:block;font-size:14px;opacity:.9;margin-top:4px;font-weight:700}
.scorebar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.scorebar span{background:rgba(0,0,0,.6);border:3px solid #111;border-radius:8px;padding:4px 12px;font-size:16px}
.noob{position:relative;width:90px;height:140px;animation:bob 1.6s ease-in-out infinite;margin-bottom:6px}
.noob i{position:absolute;display:block;border:3px solid #111}
.noob .head{left:25px;top:0;width:42px;height:42px;background:#f5cd30;color:#111;text-align:center;line-height:36px;font-size:15px;font-style:normal}
.noob .torso{left:20px;top:42px;width:52px;height:46px;background:#00a2ff}
.noob .al{left:-2px;top:42px;width:20px;height:46px;background:#f5cd30}
.noob .ar{left:74px;top:42px;width:20px;height:46px;background:#f5cd30}
.noob .ll{left:20px;top:88px;width:26px;height:46px;background:#02b757}
.noob .lr{left:46px;top:88px;width:26px;height:46px;background:#02b757}
/* top bar */
.top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(27,42,52,.95);border-bottom:5px solid #111;z-index:3;overflow:hidden}
.top .grow{flex:1}
.stat{background:#2f4352;border:3px solid #111;border-radius:8px;padding:4px 10px;font-size:15px;white-space:nowrap}
.stat b{color:var(--yellow);font-size:20px}
/* tetris */
.mid{flex:1;min-height:0;display:flex;justify-content:center;gap:14px;padding:10px;position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto}
.canwrap{flex:1;min-width:0;display:flex;justify-content:flex-end;align-items:flex-start}
#tc{border:5px solid #111;border-radius:6px;background:#14202a;display:block;touch-action:none}
.side{flex:0 0 130px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sidebox{background:rgba(27,42,52,.92);border:4px solid #111;border-radius:10px;padding:8px;text-align:center;width:100%;font-size:15px}
#nc{display:block;margin:6px auto 0;background:#14202a;border:3px solid #111;border-radius:6px}
.tip{font-size:13px;line-height:1.4;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px 14px 16px;background:rgba(27,42,52,.95);border-top:5px solid #111;z-index:3;width:100%;max-width:760px;margin:0 auto}
.pad .btn{height:clamp(58px,10vh,84px);font-size:30px;padding:0}
/* overlay / cards */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30}
.overlay.on{display:flex}
.card{background:#2b3a46;border:5px solid #111;border-radius:16px;padding:20px;width:min(600px,94vw);text-align:center;box-shadow:0 8px 0 #111}
.card h2{margin:0 0 6px;font-size:30px;color:var(--yellow)}
.card .big{font-size:42px;margin:6px 0}
.card .ex{margin:8px 0 14px;font-size:17px;line-height:1.5}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#quiz{z-index:40}
#qText{font-size:clamp(24px,4.4vw,34px);background:#fff;color:#222;border:4px solid #111;border-radius:12px;padding:14px;margin:8px 0;line-height:1.35}
#qSub{font-size:18px;color:#cfe}
#qChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.choice{font-size:clamp(22px,4vw,30px)!important;padding:16px 8px!important}
.choice.right{background:var(--green)!important}
.choice.wrong{background:var(--red)!important;opacity:.85}
#qFb{min-height:56px;margin-top:14px;font-size:18px;line-height:1.5}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:#111;border:4px solid var(--yellow);border-radius:12px;padding:10px 18px;font-size:22px;z-index:25;display:none;text-align:center;max-width:90%}
.toast.on{display:block;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(-50%,-50%) scale(1)}}
/* bubble */
#bq{background:#fff;color:#222;border:4px solid #111;border-radius:12px;margin:10px 12px 0;padding:10px 14px;font-size:clamp(20px,3.8vw,30px);text-align:center;z-index:3;box-shadow:0 5px 0 #111}
#bq small{display:block;font-size:14px;color:#0a6;font-weight:700}
#bwrap{flex:1;position:relative;min-height:0}
#bc{position:absolute;left:0;top:0;touch-action:none}
.hearts{font-size:24px;letter-spacing:2px}
/* notes */
#notes{background:linear-gradient(#4fb0ff,#d6f1ff)}
.nbody{flex:1;overflow:auto;padding:12px;z-index:2;max-width:760px;width:100%;margin:0 auto}
.tabs{display:flex;gap:10px;padding:10px 12px 0;max-width:760px;margin:0 auto;width:100%;z-index:2}
.tabs .btn{flex:1;font-size:18px;padding:8px}
.wcard{display:flex;align-items:center;gap:10px;background:#2b3a46;border:4px solid #111;border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 0 #111}
.wcard .w{font-size:24px;color:var(--yellow);min-width:96px}
.wcard .m{flex:1;font-size:16px;font-weight:700;line-height:1.35}
.wcard .c{font-size:13px;color:#ffb4ae}
.empty{background:#2b3a46;border:4px solid #111;border-radius:10px;padding:24px;text-align:center;font-size:20px}
.lvbody{position:relative;z-index:2;width:min(640px,94vw);margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:14px 0;overflow:auto;flex:1}
.lvbtn{display:flex!important;align-items:center;gap:14px;text-align:left;font-size:24px!important;padding:12px 16px!important;width:100%}
.lvbtn .n{font-size:38px;min-width:56px;text-align:center}
.lvbtn small{display:block;font-size:14px;font-weight:700;margin-top:2px}
.lvbtn .bs{margin-left:auto;font-size:14px;background:rgba(0,0,0,.35);border-radius:8px;padding:4px 8px;white-space:nowrap;color:#fff}
.btn.p{background:#b05cff;box-shadow:0 6px 0 #6f2fb3,0 8px 0 #111}
#dwrap{flex:1;position:relative;min-height:0}
.dbase{height:44px;z-index:0}
#dc{position:absolute;left:0;top:0;touch-action:none;z-index:1}
#dLives{font-size:18px}
#dq{margin:0 12px 14px;background:#fff;color:#222;border:5px solid #111;border-radius:14px;padding:10px 14px;text-align:center;z-index:3;box-shadow:0 6px 0 #111;min-height:88px;display:flex;flex-direction:column;justify-content:center}
#dq small{font-size:14px;color:#0a6;font-weight:700}
#dqText{font-size:clamp(22px,4.2vw,32px);line-height:1.3}
#dq.ok{background:#c8f7d4}
#dq.bad{background:#ffd1ce}
.hbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:760px;width:100%;margin:0 auto;z-index:2}
.hq{background:#fff;color:#222;border:5px solid #111;border-radius:14px;padding:12px;text-align:center;box-shadow:0 6px 0 #111}
.hq small{font-size:14px;color:#0a6;font-weight:700}
.hw{font-size:clamp(40px,8vw,64px);color:#e2231a;line-height:1.1}
.hm{font-size:clamp(18px,3.4vw,24px);margin-top:6px;line-height:1.4}
#hChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{display:flex!important;flex-direction:column;align-items:center;gap:6px;padding:12px 6px!important;font-size:clamp(36px,7vw,56px)!important;font-family:"Noto Serif CJK KR","Noto Serif KR","Batang","AppleMyungjo",serif!important}
.hc .hx{font-size:15px;line-height:1.3;min-height:20px;font-weight:700;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.hc.right{background:var(--green)!important}
.hc.wrong{background:var(--red)!important;opacity:.85}
#hFb{min-height:64px;background:#2b3a46;border:4px solid #111;border-radius:12px;padding:10px;font-size:18px;line-height:1.6;text-align:center}
#hHint{font-size:18px!important;padding:10px!important}
@media (max-height:780px){.noob{display:none}}
body{position:relative}
#dkb{display:none;gap:8px;margin:0 12px 12px;z-index:3}
#dIn{flex:1;min-width:0;font:inherit;font-size:24px;padding:10px 14px;border:4px solid #111;border-radius:12px;color:#222;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
#dIn:focus{border-color:var(--blue)}
.hc{font-size:clamp(26px,5.5vw,40px)!important;font-family:inherit!important;padding:18px 6px!important}
.hw{letter-spacing:10px}
.hw .hon{color:#e2231a}
.hw .hoff{color:#9aa5ad}
.hq small#hAsk{font-size:clamp(14px,2.6vw,18px)}
#dBoom{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-size:clamp(44px,9vw,84px);color:#fff;-webkit-text-stroke:2px #111;text-shadow:0 5px 0 #111;z-index:27;display:none;pointer-events:none;white-space:nowrap}
#dBoom.on{display:block;animation:boom .9s ease-out}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25) rotate(6deg);opacity:1}60%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-85%) scale(1);opacity:0}}
#dwrap.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.hc{font-size:clamp(20px,4.2vw,28px)!important;line-height:1.5;padding:14px 8px!important}
.exp{margin-top:10px;background:#fff7d6;color:#2a2a2a;border:4px solid #111;border-radius:12px;padding:10px 12px;font-size:clamp(16px,3vw,20px);line-height:1.6;text-align:left;box-shadow:0 4px 0 #111}
.exp b{color:#c2410c}
#hFb small{font-size:14px;opacity:.85}
.hbody>*{flex-shrink:0}
#hFb{overflow:visible;height:auto;word-break:keep-all;overflow-wrap:anywhere}
.exp{word-break:keep-all;overflow-wrap:anywhere}
.hbody{padding-bottom:40px}
#quiz .card{max-height:92vh;overflow:auto}
.wcard{flex-wrap:wrap}
.sqbody{flex:1;overflow:auto;padding:12px;z-index:2;max-width:720px;width:100%;margin:0 auto}
.sqbar{height:12px;background:#0d1a22;border:3px solid #111;border-radius:8px;overflow:hidden;margin-bottom:10px}
.sqbar>div{height:100%;background:var(--green);transition:width .3s}
.sqi{background:#2b3a46;border:4px solid #111;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 4px 0 #111}
.sqno{font-size:15px;color:var(--yellow);margin-bottom:6px}.sqno span{color:#9fe;font-size:13px}
.sqq{font-size:clamp(15px,2.3vw,18px);line-height:1.6;margin-bottom:10px;word-break:keep-all}
.sqq b{color:var(--yellow);font-size:14px}
.sqo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sqb{font-size:clamp(15px,2.4vw,19px)!important;padding:10px 6px!important}
.sqb.right{background:var(--green)!important}.sqb.wrong{background:var(--red)!important;opacity:.9}
.sqin{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border:4px solid #111;border-radius:10px;font-family:inherit}
.sqin.okin{background:#c8f7d4}.sqin.badin{background:#ffd1ce}
.sqok{margin-top:10px;font-size:17px!important;padding:10px 16px!important}
.sqfb{border:4px solid #111;border-radius:12px;padding:10px 12px;box-shadow:0 4px 0 #111;font-size:clamp(14px,2.1vw,16px);line-height:1.65;word-break:keep-all}
.sqfb.good{background:#1f4a33}.sqfb.bad{background:#4f2a2a}
.sqres{font-size:clamp(17px,2.6vw,20px);margin-bottom:6px}
.sqsec{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;margin-top:8px}
.sqsec b{color:var(--yellow)}
.sqhj{font-size:22px;font-family:"Noto Serif CJK KR","Noto Serif KR",serif;color:#fff}
.sqopt{font-size:14px;line-height:1.5;margin-top:5px;opacity:.9}.sqopt.c{opacity:1}.sqopt b{color:#9fe}
#sqScore{background:#fff;color:#222;border:5px solid #111;border-radius:14px;padding:12px;text-align:center;margin-bottom:12px;box-shadow:0 6px 0 #111;font-size:17px}
.sqbigt{font-size:15px;color:#0a6;font-weight:700}.sqnum{font-size:clamp(40px,9vw,60px);color:#e2231a;line-height:1.1}
.sqfoot{display:flex;align-items:center;gap:10px;padding:10px 12px;z-index:3;background:#1b2a34;border-top:4px solid #111}
.sqfoot span{flex:1;font-size:15px;line-height:1.3}
.sqfoot .btn{font-size:18px;padding:10px 16px}
#sheet .tabs{padding-top:6px}#sheet .tabs .btn{font-size:16px;padding:6px 4px}
#sqLvName{font-size:14px;color:var(--yellow);text-align:center;margin:6px auto 0;z-index:2;background:#0d1a22;border:3px solid #111;border-radius:10px;padding:3px 12px}
#sqMode{padding-bottom:4px}
#sqDaily{font-size:15px;text-align:center;background:#0d1a22;border:3px solid #111;border-radius:10px;margin:6px 12px 0;padding:5px 8px;z-index:2;color:#9fe;max-width:720px;align-self:center;width:calc(100% - 24px)}
.sqcheer{background:#fff7d6;color:#3a2a00;border:3px solid #111;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:clamp(14px,2.1vw,16px);line-height:1.55}
.sqdl{margin-top:6px;font-size:15px;color:#0a6}
.plv{width:100%;background:rgba(0,0,0,.65);border:4px solid #111;border-radius:12px;padding:8px 12px;text-align:center;box-shadow:0 4px 0 #111}
.plvt{font-size:20px}.plvt b{color:var(--yellow);font-size:26px;margin-right:6px}
.plvbar{height:14px;background:#0d1a22;border:3px solid #111;border-radius:8px;overflow:hidden;margin:6px 0}
.plvbar>div{height:100%;background:linear-gradient(90deg,#00a2ff,#02b757);transition:width .4s}
.plvs{font-size:13px;color:#9fe}
#lvUp{position:fixed;left:50%;top:14%;transform:translate(-50%,0);z-index:999;background:#fff7d6;color:#3a2a00;border:5px solid #111;border-radius:16px;padding:10px 22px;font-size:26px;text-align:center;box-shadow:0 6px 0 #111;display:none;pointer-events:none}
#lvUp small{display:block;font-size:15px;margin-top:2px}
#lvUp.on{display:block;animation:lvup 2.2s ease-out}
@keyframes lvup{0%{transform:translate(-50%,-30px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}30%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.sqbar.retry>div{background:#ff7a1a}
.sqagain{background:#ff7a1a;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.nprint{display:flex;gap:10px;padding:8px 12px 0;max-width:760px;margin:0 auto;width:100%;z-index:2;box-sizing:border-box}
.nprint .btn{flex:1;font-size:15px;padding:8px 4px}
#nMsg{text-align:center;color:var(--yellow);font-size:15px;z-index:2;min-height:0}
.nhead{background:#111;color:var(--yellow);border-radius:8px;padding:6px 12px;margin:6px 0 8px;font-size:18px}
#notes .exp{font-size:14px;margin-top:6px}
#printArea{display:none}
@page{size:A4;margin:14mm}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:11pt;line-height:1.5}
  #printArea h1{font-size:20pt;margin:0 0 6px}
  #printArea h2{font-size:14pt;margin:16px 0 6px;border-bottom:2px solid #000;padding-bottom:3px;page-break-after:avoid}
  .pmeta{font-size:11pt;margin-bottom:10px}
  .pguide{font-size:11pt;margin:4px 0 12px;padding:6px 10px;border:1px dashed #000}
  #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt}
  #printArea th,#printArea td{border:1px solid #000;padding:5px 7px;vertical-align:top;text-align:left}
  #printArea th{background:#eee}
  #printArea tr{page-break-inside:avoid}
  .c1{width:26px;text-align:center!important}.c2{width:90px}.c5{width:42px;text-align:center!important}
  .pq{padding:8px 0;border-bottom:1px dotted #888;page-break-inside:avoid;font-size:12pt}
  .ptag{border:1px solid #000;border-radius:4px;padding:0 5px;font-size:9pt;margin-right:4px}
  .pans{margin-top:8px;font-size:12pt}
  .pbreak{page-break-after:always}
  .pa{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12pt;margin-top:8px}
  .pfoot{margin-top:14px;font-size:10pt}
}
.msbox{width:100%;background:rgba(0,0,0,.65);border:4px solid #111;border-radius:12px;padding:8px 10px;box-shadow:0 4px 0 #111}
.mst{display:flex;justify-content:space-between;font-size:17px;margin-bottom:6px}.mst b{color:var(--yellow);font-size:22px}
.msrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.msc{display:flex;flex-direction:column;align-items:center;gap:1px;background:#2b3a46;color:#fff;border:3px solid #111;border-radius:10px;padding:6px 4px;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #111}
.msc.done{background:#1f6b3f}
.msi{font-size:24px}.msl{font-size:13px;line-height:1.25;text-align:center}.mss{font-size:12px;color:#9fe}
.msweek{display:flex;justify-content:space-between;margin:8px 4px 2px;font-size:15px}
.msd{display:flex;flex-direction:column;align-items:center;min-width:36px;opacity:.75}.msd i{font-style:normal;font-size:11px;color:#9fe}.msd.today{opacity:1;outline:2px solid var(--yellow);border-radius:8px}

.sb{display:flex;gap:6px;padding:4px 8px;overflow-x:auto;align-items:stretch;background:rgba(0,0,0,.4);border-bottom:3px solid #111;flex:0 0 auto}
.sb .chip{flex:0 0 auto;background:#2f4352;border:3px solid #111;border-radius:8px;padding:2px 9px;font-size:12px;line-height:1.3;text-align:center;color:#fff;white-space:nowrap;opacity:.8}
.sb .chip b{font-size:17px;color:#f5cd30}

.sb .chip.tot{margin-left:auto;background:#02b757;color:#fff;opacity:1}
.sb .chip.tot b{color:#fff;font-size:19px}
.sb .chip.bump{animation:sbump .4s}
@keyframes sbump{40%{transform:scale(1.22);background:#fff}}
.sbl{margin-top:6px;text-align:left;font-size:14px;line-height:1.7}
.ringed{position:relative;overflow:visible!important}
.ring{position:absolute;left:-10px;top:-12px;width:calc(100% + 20px);height:calc(100% + 24px);pointer-events:none;overflow:visible;z-index:6}
.ring path{fill:none;stroke:#e11d48;stroke-width:7;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:ringdraw .8s ease-out forwards;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
@keyframes ringdraw{to{stroke-dashoffset:0}}
#bigO{position:fixed;left:50%;top:46%;width:min(66vw,56vh);height:min(66vw,56vh);margin:calc(min(66vw,56vh)/-2) 0 0 calc(min(66vw,56vh)/-2);border:clamp(14px,3.4vw,28px) solid #e11d48;border-radius:50%;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,8vw,64px);font-weight:900;color:#e11d48;text-shadow:0 3px 0 #fff,0 0 12px #fff;background:rgba(255,255,255,.18);animation:bigo 1.15s ease-out forwards}

/* ===== 기기별 최적화: 폰 / 태블릿 / PC ===== */
:root{--z:1;--hw:760px;--gw:100vw}

@media (hover:none){.btn,.msc,.tabs button{min-height:40px}body{-webkit-user-select:none;user-select:none;-webkit-touch-action:manipulation;touch-action:manipulation}}
</style>

const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ===== 어휘 목록 (난이도 1~5) ===== */

let AC;
function beep(f,d,type,v,when){
  if(!soundOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    const t=AC.currentTime+(when||0);
    g.gain.setValueAtTime(v||0.06,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  ok:()=>{beep(660,.1);beep(880,.18,'square',.06,.1)},
  bad:()=>beep(200,.28,'sawtooth'),
  pop:()=>beep(900,.07,'sine',.12),

let vKo=null;
function say(t){
  if(!soundOn||!window.speechSynthesis)return;
  try{
    const ss=window.speechSynthesis;ss.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.05;u.pitch=1.5;u.volume=1;
    if(!vKo){const v=ss.getVoices().filter(x=>/^ko/i.test(x.lang));vKo=v[0]||null}
    if(vKo)u.voice=vKo;
    ss.speak(u);
  }catch(e){}
}

// 💰 용돈 통장: 문제 풀이 1개당 5원, 틀린 문제 다시 풀기 1개당 10원
const WON_SOLVE=5,WON_RETRY=10,WON_WRONG=2;
let WON=store.get('wb_won',{total:0,days:{},cnt:0,rcnt:0});
function wonToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wonFmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function wonTodayAmt(){return (WON.days&&WON.days[wonToday()])||0}
function wonAdd(retry,ok){
  if(ok===undefined)ok=true;
  const a=ok?(retry?WON_RETRY:WON_SOLVE):-WON_WRONG;
  WON.total=Math.max(0,(WON.total||0)+a);WON.days=WON.days||{};
  const k=wonToday();WON.days[k]=Math.max(0,(WON.days[k]||0)+a);
  if(retry)WON.rcnt=(WON.rcnt||0)+1;else WON.cnt=(WON.cnt||0)+1;
  const ks=Object.keys(WON.days).sort();while(ks.length>60)delete WON.days[ks.shift()];
  store.set('wb_won',WON);
  try{
    let f=document.getElementById('wonFly');
    if(!f){f=document.createElement('div');f.id='wonFly';document.body.appendChild(f)}
    f.textContent=a>0?'💰 +'+a+'원':'💸 '+a+'원';f.classList.toggle('neg',a<0);f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
  }catch(e){}
  try{refreshWon()}catch(e){}
}
function refreshWon(){
  const b=document.getElementById('wonBox');if(!b)return;
  b.innerHTML='<div class="wt">💰 내 용돈 통장 <b>'+wonFmt(WON.total||0)+'원</b> · 오늘 <b style="font-size:18px">+'+wonFmt(wonTodayAmt())+'원</b></div><div class="ws">정답 1개 +'+WON_SOLVE+'원 · 틀린 문제 다시 풀어 맞히면 +'+WON_RETRY+'원 · 틀리면 −'+WON_WRONG+'원</div>'
    +(WON_ASK?'<div class="wr ask">⚠️ 용돈 <b>'+wonFmt(WON.total||0)+'원</b>이 모두 0원이 돼요. 정말 초기화할까요?<br><button class="btn sm" style="background:#dc2626;color:#fff" onclick="wonReset(true)">네, 초기화</button> <button class="btn sm" onclick="wonReset(false)">아니요, 취소</button></div>'
     :'<div class="wr"><button class="btn sm" style="font-size:12px;padding:4px 10px" onclick="wonReset()">🔄 용돈 초기화</button></div>');
}
let WON_ASK=false,WON_AT=0;
function wonReset(v){
  if(v===undefined){WON_ASK=true;clearTimeout(WON_AT);WON_AT=setTimeout(()=>{WON_ASK=false;refreshWon()},8000)}
  else if(v===true){
    clearTimeout(WON_AT);WON_ASK=false;
    WON={total:0,days:{},cnt:0,rcnt:0};store.set('wb_won',WON);
    try{bigToast('🔄 용돈이 <b>0원</b>으로<br>초기화됐어요!',1800)}catch(e){}
  }else{clearTimeout(WON_AT);WON_ASK=false}
  refreshWon();
}

function pxNeed(L){return 40+4*(L-1)}               // 레벨 L → L+1 에 필요한 경험치
function pxInfo(){
  let L=1,x=PX.xp;
  while(L<PLV_MAX&&x>=pxNeed(L)){x-=pxNeed(L);L++}
  if(L>=PLV_MAX)x=pxNeed(L);
  return {lv:L,cur:x,need:pxNeed(L),max:L>=PLV_MAX,title:PTITLES[Math.min(PTITLES.length-1,Math.floor((L-1)/10))]};
}
function addXP(ok,bonus){
  const before=pxInfo().lv;
  PX.n++;if(ok)PX.r++;
  PX.xp+=(ok?10+(bonus||0):3);
  store.set('wb_px',PX);
  const a=pxInfo();
  if(a.lv>before)pxLevelUp(a);
}
function pxLevelUp(a){
  let t=document.getElementById('lvUp');
  if(!t){t=document.createElement('div');t.id='lvUp';document.body.appendChild(t)}
  t.innerHTML='🎉 '+PLAYER+' 레벨 업! <b>Lv.'+a.lv+'</b><small>'+a.title+'</small>';
  t.classList.remove('on');void t.offsetWidth;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);
  try{if(sfx&&sfx.line)sfx.line()}catch(e){}
  refreshPlv();
}
let plvRT=0;
function plvReset(){
  const b=$('plvR');
  if(!b.dataset.sure){
    b.dataset.sure='1';b.textContent='⚠️ 정말 Lv.1로? 한 번 더 누르세요';b.classList.add('r');
    clearTimeout(plvRT);plvRT=setTimeout(()=>{delete b.dataset.sure;b.textContent='🔄 레벨 초기화';b.classList.remove('r')},4000);
    return;
  }
  clearTimeout(plvRT);delete b.dataset.sure;b.classList.remove('r');
  PX={xp:0,n:0,r:0};store.set('wb_px',PX);
  b.textContent='🔄 레벨 초기화';refreshPlv();
  try{bigToast('🔄 <b>Lv.1</b>로 초기화됐어요!<br>다시 시작! 💪',1800)}catch(e){}
}
function refreshPlv(){
  const a=pxInfo();
  if(!document.getElementById('plvN'))return;
  $('plvN').textContent=PLAYER+' · Lv.'+a.lv+' / '+PLV_MAX;
  $('plvT').textContent=a.title;
  $('plvB').style.width=Math.round(a.cur/a.need*100)+'%';
  $('plvS').textContent=(a.max?'🏆 만렙 달성! 대단해요 · ':'다음 레벨까지 '+(a.need-a.cur)+' XP · ')+'지금까지 '+PX.n+'문제 (정답 '+PX.r+')';
}

function msComplete(){

/* ===== 퀴즈 공통 ===== */
let recent=[];
function pickWord(){
  const nk=Object.keys(notes);
  let w=null;
  if(nk.length&&Math.random()<0.35){
    const k=nk[Math.floor(Math.random()*nk.length)];
    w=WORDS.find(x=>x[0]===k)||null;
  }
  if(!w){
    for(let i=0;i<30;i++){
      const c=WORDS[Math.floor(Math.random()*WORDS.length)];
      if(!recent.includes(c[0])){w=c;break}
    }
    if(!w)w=WORDS[Math.floor(Math.random()*WORDS.length)];
  }
  recent.push(w[0]);if(recent.length>20)recent.shift();
  return w;
}
function makeQ(){
  const w=pickWord();const opts=[w];
  while(opts.length<4){const c=WORDS[Math.floor(Math.random()*WORDS.length)];if(!opts.includes(c))opts.push(c)}
  shuffle(opts);
  return {w,opts};
}
function recordResult(w,ok){
  addXP(ok);if(ok)msAdd('game');
  if(ok){if(notes[w[0]]){notes[w[0]]--;if(notes[w[0]]<=0)delete notes[w[0]]}}
  else{notes[w[0]]=(notes[w[0]]||0)+1}
  store.set('wb_notes',notes);
}
function askQuiz(cb){
  const q=makeQ();
  $('qText').textContent='「'+q.w[1]+'」';
  $('qSub').textContent='이 뜻에 맞는 낱말은?';
  const box=$('qChoices');box.innerHTML='';$('qFb').textContent='';
  let done=false;
  const btns=[];
  q.opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='btn choice';b.textContent=o[0];
    b.onclick=()=>{
      if(done)return;done=true;
      const ok=(o===q.w);
      btns.forEach((bb,i)=>{if(q.opts[i]===q.w){bb.classList.add('right');ringOn(bb)}});
      if(!ok)b.classList.add('wrong');
      recordResult(q.w,ok);wonAdd(false,ok);
      quizFx(ok);
      $('qFb').innerHTML=(ok?'⭕ 정답! ':'❌ 아쉬워! 정답은 ')+'<b style="color:#f5cd30">'+q.w[0]+'</b> = '+q.w[1];
      setTimeout(()=>{$('quiz').classList.remove('on');cb(ok,q.w)},ok?1200:2200);
    };
    box.appendChild(b);btns.push(b);
  });
  $('quiz').classList.add('on');
}
function toast(id,text,ms){
  const t=$(id);t.textContent=text;t.classList.remove('on');void t.offsetWidth;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms||1400);
}
function sbRender(id,st,cur,total,lab,bump){
  const el=$(id);if(!el)return;
  let h='';
  Object.keys(st).map(Number).sort((a,b)=>a-b).forEach(k=>{
    h+='<div class="chip'+(k===cur?' cur':'')+(k===bump?' bump':'')+'"><div>'+lab(k)+'</div><b>'+st[k].p+'점</b> · '+st[k].n+'개</div>';
  });
  h+='<div class="chip tot"><div>합계</div><b>'+total+'</b>점</div>';
  el.innerHTML=h;
  const c=el.querySelector('.cur');if(c&&c.scrollIntoView)try{el.scrollLeft=c.offsetLeft-el.clientWidth/2}catch(e){}
}
function sbSummary(st,lab){
  return '<div class="sbl">'+Object.keys(st).map(Number).sort((a,b)=>a-b).map(k=>lab(k)+' : <b>'+st[k].n+'개 · '+st[k].p+'점</b>').join('<br>')+'</div>';
}
function endOverlay(id,title,score,bestv,extra,again,alt){
  const o=$(id);
  o.innerHTML='<div class="card"><h2>'+title+'</h2><div class="big">'+score+'점</div><div>🏆 최고 '+bestv+'점</div><div class="ex">'+extra+'</div><div class="row"><button class="btn g" id="'+id+'A">다시 하기</button>'+(alt?'<button class="btn y" id="'+id+'L">'+alt.label+'</button>':'')+'<button class="btn" id="'+id+'H">홈으로</button></div></div>';
  o.classList.add('on');
  $(id+'A').onclick=()=>{o.classList.remove('on');again()};
  if(alt)$(id+'L').onclick=()=>{o.classList.remove('on');alt.fn()};
  $(id+'H').onclick=()=>{o.classList.remove('on');show('home')};
}

const D={st:{},running:false,paused:false,over:false,w:0,h:0,dpr:1,gy:0,words:[],fx:[],score:0,lives:5,combo:0,start:1,level:1,correct:0,target:null,lockUntil:0,time:0,spawnT:0,last:0,seq:0,raf:0};
let dRecent=[];

function tierOf(L){
  if(L<=1)return 1;
  const r=Math.random();
  return r<.6?L:(r<.85?L-1:Math.max(1,L-2));
}
function pickDropWord(){
  const on=D.words.map(b=>b.o[0]);
  const nk=Object.keys(notes).filter(k=>{const w=WORDS.find(x=>x[0]===k);return w&&w[2]<=D.level&&!on.includes(k)});
  if(nk.length&&Math.random()<.3)return WORDS.find(x=>x[0]===nk[Math.floor(Math.random()*nk.length)]);
  for(let i=0;i<50;i++){
    const t=tierOf(D.level);
    const pool=WORDS.filter(w=>w[2]===t&&!on.includes(w[0])&&!dRecent.includes(w[0]));
    if(pool.length)return pool[Math.floor(Math.random()*pool.length)];
  }
  const pool=WORDS.filter(w=>w[2]<=D.level&&!on.includes(w[0]));
  return pool[Math.floor(Math.random()*pool.length)];
}
function dRadius(){return Math.max(36,Math.min(D.w/(LV[D.level-1].max*1.55),D.h*.11,70))}
function spawnWord(yOff){
  const w=pickDropWord();if(!w)return;
  const r=dRadius();
  let x=0;
  for(let i=0;i<20;i++){
    x=r+10+Math.random()*Math.max(1,D.w-2*r-20);
    if(!D.words.some(b=>!b.dead&&b.y<D.h*.35&&Math.abs(b.x-x)<r*2.1))break;
  }
  D.words.push({o:w,r,x,y:-r-(yOff||0),vm:.85+Math.random()*.4,ph:Math.random()*6,amp:4+Math.random()*6,col:BCOL[D.seq++%BCOL.length],dead:false,miss:false});
  dRecent.push(w[0]);if(dRecent.length>12)dRecent.shift();
}
function dSpeed(){
  const L=LV[D.level-1];
  let extra=0;
  if(D.level===5)extra=Math.min(.03,Math.max(0,Math.floor((D.correct-(5-D.start)*8)/8))*.004);
  return (L.speed+extra)*0.27;
}

function dUpdate(dt){
  D.time+=dt;

  const live=D.words.filter(b=>!b.dead).length;
  D.spawnT-=dt;
  if(live<=1||D.spawnT<=0){
    if(live<L.max){
      const k=Math.min(L.burst,L.max-live);
      for(let i=0;i<k;i++)spawnWord(i*D.h*(.08+Math.random()*.1)+Math.random()*D.h*.05);
    }
    D.spawnT=L.gap*(0.85+Math.random()*.3);
  }
  if(!D.init&&D.words.length){D.init=true;D.words.forEach(b=>{b.y+=D.h*.14+b.r})}
  const sp=dSpeed()*D.h;
  for(const b of D.words){
    if(b.dead)continue;
    b.y+=sp*dt*(b.vm||1);
    if(b.y+b.r*.6>=D.gy){
      b.dead=true;
      D.fx.push({x:dX(b),y:D.gy-6,r:b.r*.8,t:0,c:'#ffffff'});
      if(b===D.target){
        D.target=null;D.lives--;D.combo=0;
        if(!b.miss){recordResult(b.o,false);wonAdd(false,false)}
        sfx.bad();dHud();
        dBoom();D.em.push({x:dX(b),y:D.gy-20,e:'💦',t:0});
        dMsg('😢 놓쳤어요! '+b.o[0]+' = '+b.o[1],'bad');
        D.lockUntil=D.time+1;
        if(D.lives<=0)dEnd();
      }
    }
  }
  D.words=D.words.filter(b=>!b.dead);
  D.fx=D.fx.filter(f=>(f.t+=dt)<.45);
  D.em=D.em.filter(f=>(f.t+=dt)<1);
  if(!D.target&&!D.over&&D.time>=D.lockUntil)dChoose();
}
function dX(b){return b.x+Math.sin(b.ph+D.time*1.5)*b.amp}
function drawBubble(ctx,x,y,r,col,text){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,col);g.addColorStop(1,col);
  ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle='#111';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r-7,Math.PI*1.1,Math.PI*1.5);
  ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.stroke();
  let lines=[text];
  if(text.length>4&&text.indexOf(' ')>0){
    let idx=-1,bd=99;
    for(let i=0;i<text.length;i++){if(text[i]===' '&&Math.abs(i-text.length/2)<bd){bd=Math.abs(i-text.length/2);idx=i}}
    lines=[text.slice(0,idx),text.slice(idx+1)];
  }
  const mx=Math.max(...lines.map(l=>l.length));
  const fs=Math.round(r*(lines.length>1?(mx>4?.3:.36):(mx>3?.36:mx>2?.44:.52)));
  ctx.font='900 '+fs+'px "Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  lines.forEach((ln,i)=>{
    const yy=y+2+(i-(lines.length-1)/2)*fs*1.15;
    ctx.lineWidth=6;ctx.strokeStyle='#111';ctx.strokeText(ln,x,yy);
    ctx.fillStyle='#fff';ctx.fillText(ln,x,yy);
  });
}
function drawFx(ctx,list){
  for(const f of list){
    const p=f.t/.45;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+p*.6),0,Math.PI*2);
    ctx.lineWidth=Math.max(.1,6*(1-p));ctx.strokeStyle=f.c;ctx.globalAlpha=Math.max(0,1-p);ctx.stroke();
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2,d=f.r*(.8+p*1.2);
      ctx.fillStyle=f.c;
      ctx.fillRect(f.x+Math.cos(a)*d-5,f.y+Math.sin(a)*d-5,10,10);
    }
    ctx.globalAlpha=1;
  }
}
function dDraw(){
  dx.setTransform(D.dpr,0,0,D.dpr,0,0);

}
function dLoop(ts){

}

function dTap(b,x){

const BOOMS=['꽝! 💥','앗! 😵','땡! 🙈','으악! 🥴','쾅! 💣','어이쿠! 🤪','헉! 😱'];

function dKbSubmit(){
  if(!D.running||D.paused||D.over||!D.kb)return;
  const inp=$('dIn');
  const v=kbNorm(inp.value);
  if(!v){inp.value='';return}
  if(!D.target)return;   // 뜻을 준비하는 중에는 기다림
  inp.value='';
  if(v===kbNorm(D.target.o[0])){const b=D.target;dTap(b,dX(b));return}
  const o=D.words.find(b=>!b.dead&&b!==D.target&&kbNorm(b.o[0])===v);
  if(o){dTap(o,dX(o));return}
  dBoom();   // 오타
}
// 스페이스: 낱말이 완성됐으면 제출, 띄어쓰기 낱말(예: 발이 넓다)을 쓰는 중이면 그대로 이어서 입력
function dKbInput(){
  const inp=$('dIn');
  if(!/\s$/.test(inp.value))return;
  const v=kbNorm(inp.value);
  if(!v){inp.value='';return}
  const hit=D.words.some(b=>!b.dead&&kbNorm(b.o[0])===v);
  const part=D.words.some(b=>!b.dead&&kbNorm(b.o[0]).startsWith(v));
  if(hit||!part)dKbSubmit();
}

const B={st:{},running:false,over:false,w:0,h:0,dpr:1,bubbles:[],fx:[],score:0,lives:3,combo:0,q:null,last:0,round:0,locked:false,right:0,wrongN:0,time:0};
const bc=$('bc'),bx=bc.getContext('2d');
const BCOL=['#e2231a','#f5cd30','#02b757','#00a2ff','#b05cff','#ff8a1e'];
function bFit(){
  const wrap=$('bwrap');
  B.dpr=Math.min(2,window.devicePixelRatio||1);
  B.w=wrap.clientWidth;B.h=wrap.clientHeight;
  bc.width=B.w*B.dpr;bc.height=B.h*B.dpr;
  bc.style.width=B.w+'px';bc.style.height=B.h+'px';
}
const bLab=k=>'STAGE '+k;
let bBump=0;
function bStage(){return Math.floor(B.right/5)+1}
function bHud(){
  $('bScore').textContent=B.score;$('bCombo').textContent=B.combo;
  sbRender('bSB',B.st,bStage(),B.score,bLab,bBump);bBump=0;
  $('bLives').textContent=('❤️'.repeat(B.lives)+'🖤'.repeat(Math.max(0,3-B.lives)));
}
function newRound(){
  B.round++;
  B.q=makeQ();B.q.missed=false;
  $('bq').innerHTML='「'+B.q.w[1]+'」<small>이 뜻에 맞는 낱말 방울을 터뜨려요!</small>';
  B.bubbles=[];
  const n=4;
  const r=Math.max(44,Math.min(B.w/(n*2.25),B.h*0.13,86));
  const speed=B.h/Math.max(9,(15-B.round*0.1));
  const cols=shuffle([0,1,2,3]);const slot=B.w/n;
  const cc=shuffle(BCOL.slice());
  B.q.opts.forEach((o,i)=>{
    B.bubbles.push({o,ok:o===B.q.w,r,x:slot*(cols[i]+.5)+(Math.random()-.5)*slot*.12,
      y:B.h+r+Math.random()*B.h*.3,vy:speed*(0.85+Math.random()*.3),
      ph:Math.random()*6,amp:6+Math.random()*10,col:cc[i]});
  });
  B.locked=false;
}
function bx_(b){return b.x+Math.sin(b.ph+B.time*1.6)*b.amp}
function bLoop(ts){
  if(!B.running)return;
  requestAnimationFrame(bLoop);
  const dt=Math.min(.05,(ts-B.last)/1000);B.last=ts;B.time+=dt;
  for(const b of B.bubbles){
    b.y-=b.vy*dt*(b.fly?3:1);
    if(b.ok&&!B.locked&&b.y+b.r<0){
      B.locked=true;B.lives--;B.combo=0;
      if(!B.q.missed){recordResult(B.q.w,false);wonAdd(false,false);B.q.missed=true}
      sfx.bad();bHud();
      toast('bToast','😢 놓쳤어요! '+B.q.w[0]+' = '+B.q.w[1],1800);
      if(B.lives<=0)setTimeout(bOver,1200);else setTimeout(()=>{if(B.running)newRound()},1000);
    }
  }
  B.bubbles=B.bubbles.filter(b=>!(b.fly&&b.y+b.r<-50));
  B.fx=B.fx.filter(f=>(f.t+=dt)<.45);
  bDraw();
}
function bDraw(){
  bx.setTransform(B.dpr,0,0,B.dpr,0,0);
  bx.clearRect(0,0,B.w,B.h);
  for(const b of B.bubbles)drawBubble(bx,bx_(b),b.y,b.r,b.col,b.o[0]);
  for(const f of B.fx){
    const p=f.t/.45;
    bx.beginPath();bx.arc(f.x,f.y,f.r*(1+p*.6),0,Math.PI*2);
    bx.lineWidth=6*(1-p);bx.strokeStyle=f.c;bx.globalAlpha=1-p;bx.stroke();bx.globalAlpha=1;
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2,d=f.r*(.8+p*1.2);
      bx.fillStyle=f.c;bx.globalAlpha=1-p;
      bx.fillRect(f.x+Math.cos(a)*d-5,f.y+Math.sin(a)*d-5,10,10);bx.globalAlpha=1;
    }
  }
}
bc.addEventListener('pointerdown',e=>{
  if(!B.running||B.locked)return;
  const rect=bc.getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  for(let i=B.bubbles.length-1;i>=0;i--){
    const b=B.bubbles[i];if(b.fly)continue;
    const x=bx_(b);
    if((px-x)**2+(py-b.y)**2<=(b.r+6)**2){
      B.fx.push({x,y:b.y,r:b.r,t:0,c:b.col});sfx.pop();

        bHud();

      }else{

        sfx.bad();bHud();
        toast('bToast','❌ 아니야! 다시 골라봐',900);
        if(B.lives<=0){B.locked=true;setTimeout(bOver,900)}
      }
      break;
    }
  }
});

function recordH(k,ok){
  addXP(ok,2);if(ok)msAdd('game');
  if(ok){if(hnotes[k]){hnotes[k]--;if(hnotes[k]<=0)delete hnotes[k]}}
  else hnotes[k]=(hnotes[k]||0)+1;
  store.set('wb_hnotes',hnotes);
}
function hRead(w){return w.p.map(c=>c[0]+' '+c[1]).join(' + ')}
function hun(s){return s.slice(0,s.lastIndexOf(' '))}   // "집 가" -> "집"
function openHLevels(){
  const box=$('hlvList');box.innerHTML='';
  HLV.forEach(L=>{
    const b=document.createElement('button');
    b.className='btn lvbtn '+L.cls;
    b.innerHTML='<div class="n">'+L.ico+'</div><div>Lv.'+L.n+' '+L.name+'<small>'+L.desc+'</small></div><div class="bs">🏆 '+(best.h[L.n]||0)+'</div>';
    b.onclick=()=>startHanja(L.n);
    box.appendChild(b);
  });
  show('hlvl');
}
function hPick(){
  const L=HLV[H.lv-1];
  const allowed=HJW.filter(w=>!H.used.includes(w.k)&&L.ts.includes(w.t));
  const top=allowed.filter(w=>w.t===H.lv);
  const low=allowed.filter(w=>w.t!==H.lv);
  let pool=(Math.random()<.65||!low.length)?top:low;
  if(!pool.length)pool=allowed;
  const nk=pool.filter(w=>hnotes[w.k]);
  if(nk.length&&Math.random()<.3)pool=nk;
  return pool[Math.floor(Math.random()*pool.length)];
}
// 같은 소리의 다른 한자 뜻 (부족하면 다른 낱말의 뜻으로 채움)
function homAlt(snd,own){
  const a=shuffle((HOM[snd]||'').split(',').filter(x=>x&&x!==own));
  const fb=shuffle(HPOOL.filter(x=>x!==own&&!a.includes(x)));
  while(a.length<3&&fb.length)a.push(fb.pop());
  return a;
}
// 보기 4개: 정답 1개 + (첫 글자만 틀림) + (둘째 글자만 틀림) + (둘 다 틀림)
function hOpt(w){
  const s=[...w.k];
  const ans=w.p.map(c=>hun(c[1]));
  const a1=homAlt(s[0],ans[0]),a2=homAlt(s[1],ans[1]);
  const key=p=>p[0]+'|'+p[1];
  const seen=new Set([key(ans)]);
  const out=[];
  const add=p=>{if(p[0]==null||p[1]==null)return;const k=key(p);if(!seen.has(k)&&out.length<3){seen.add(k);out.push(p)}};
  add([a1[0],ans[1]]);add([ans[0],a2[0]]);add([a1[1],a2[1]]);
  for(const x of a1)for(const y of a2)add([x,y]);
  for(const x of a1)add([x,ans[1]]);
  for(const y of a2)add([ans[0],y]);
  return shuffle([ans.slice()].concat(out));
}
function hLine(w,p,i){const s=[...w.k][i];return s+' : '+p[i]+' '+s}
function hHud(){$('hNo').textContent=H.no;$('hScore').textContent=H.score;$('hCombo').textContent=H.combo}
function hShow(){
  H.done=false;H.hint=false;
  const q=H.list[H.no];H.no++;
  q.opts=hOpt(q.w);
  q.ans=q.w.p.map(c=>hun(c[1]));
  q.ci=q.opts.findIndex(o=>o[0]===q.ans[0]&&o[1]===q.ans[1]);
  H.q=q;
  hHud();
  $('hAsk').textContent='한자는 「'+q.w.k+'」의 뜻으로 맞는 것은?';
  $('hWord').textContent=q.w.k;
  $('hMean').textContent='뜻: '+q.w.m;
  $('hFb').textContent='알맞은 뜻을 골라 보세요!';
  $('hNext').style.display='none';
  $('hHint').style.display='';
  const box=$('hChoices');box.innerHTML='';
  H.btns=[];
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='btn hc';
    b.innerHTML=hLine(q.w,o,0)+'<br>'+hLine(q.w,o,1);
    b.onclick=()=>hAnswer(i);
    box.appendChild(b);H.btns.push(b);
  });
}
function hAnswer(i){
  if(H.done)return;H.done=true;
  const q=H.q,ok=(i===q.ci);
  H.btns[q.ci].classList.add('right');ringOn(H.btns[q.ci]);
  if(!ok)H.btns[i].classList.add('wrong');
  recordH(q.w.k,ok);
  if(H.review&&ok){delete hnotes[q.w.k];store.set('wb_hnotes',hnotes)}
  if(ok){
    H.combo++;H.right++;
    H.score+=Math.max(2,10+H.lv*2+Math.min(H.combo,5)*2-(H.hint?4:0));
    quizFx(true);
  }else{H.combo=0;quizFx(false)}
  hHud();
  const lines=q.w.p.map((c,j)=>[...q.w.k][j]+' : '+q.ans[j]+' '+[...q.w.k][j]).join(' , ');
  $('hFb').innerHTML=(ok?'⭕ 정답! 🎉':'❌ 앗! 😵 정답은')+' <b style="color:#f5cd30">'+lines+'</b> <small>('+q.w.h+')</small>'
    +'<div class="exp">🧑‍🎮 <b>쉬운 설명</b><br>'+q.w.e+hExtra(q.w)+'</div>';
  $('hHint').style.display='none';
  const nx=$('hNext');nx.style.display='';
  nx.textContent=H.no>=H.list.length?'결과 보기 ▶':'다음 낱말 ▶';
  if(nx.scrollIntoView)nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function hEnd(){
  if(H.review){
    msAdd('review');
    endOverlay('hOver','복습 끝!',H.score,H.score,'틀린 낱말 '+H.list.length+'개 중 '+H.right+'개 맞혔어요!<br>맞힌 낱말은 오답노트에서 줄어들어요 ✅',()=>startHanjaReview(),{label:'오답노트',fn:openNotes});
    return;
  }
  if(H.score>(best.h[H.lv]||0)){best.h[H.lv]=H.score;store.set('wb_best',best)}
  endOverlay('hOver','결과 발표!',H.score,best.h[H.lv]||0,
    '정답 '+H.right+' / '+H.list.length+'<br>틀린 낱말은 📒오답노트(한자노트)에 저장됐어요!',
    ()=>startHanja(H.lv),{label:'레벨 선택',fn:openHLevels});
}
function startHanja(lv,custom){
  H.lv=lv;H.no=0;H.score=0;H.combo=0;H.right=0;H.used=[];H.list=[];H.review=!!custom;
  if(custom){shuffle(custom.slice()).forEach(w=>H.list.push({w}))}
  else for(let i=0;i<10;i++){
    const w=hPick();if(!w)break;
    H.used.push(w.k);H.list.push({w});
  }
  $('hOver').classList.remove('on');
  show('hanja');
  hShow();
}
$('hNext').onclick=()=>{if(!H.done)return;if(H.no>=H.list.length)hEnd();else hShow()};
$('hHint').onclick=()=>{
  if(H.done||!H.q||H.hint)return;
  H.hint=true;
  let n=0;
  H.q.opts.forEach((x,j)=>{if(j!==H.q.ci&&n<2){H.btns[j].style.opacity='.25';H.btns[j].disabled=true;n++}});
  $('hFb').textContent='💡 보기를 2개 지웠어요!';
};

[2,"05","조선을 건국한 태조 이성계에 대한 설명으로 옳은 것은?","한양으로 도읍을 옮기고 경복궁을 지었다.",["경국대전을 반포하였다.","대동법을 실시하였다.","수원 화성을 쌓았다.","균역법을 실시하였다."],"🏰 태조 = 조선 건국(1392) → 한양 천도 → 경복궁! 정도전이 큰 도움을 줬어요."],
[2,"06","다음 전투가 일어난 전쟁은?\n\n· 한산도 대첩\n· 행주 대첩\n· 진주 대첩","임진왜란",["병자호란","정묘호란","병인양요","신미양요"],"⚔️ 한산도·행주·진주 = 임진왜란 3대 대첩!"],
[2,"07","수원 화성을 쌓고 규장각을 설치한 조선의 왕은?","정조",["영조","세종","숙종","광해군"],"🏯 정조 = 개혁 군주! 규장각, 장용영, 수원 화성, 신해통공이 키워드예요."],
[2,"08","3·1 운동의 결과로 옳은 것은?","대한민국 임시 정부가 수립되는 계기가 되었다.",["대한 제국이 수립되었다.","토지 조사 사업이 시작되었다.","헌병 경찰 제도가 시작되었다.","회사령이 공포되었다."],"🇰🇷 3·1 운동(1919)은 상하이에 임시 정부(1919.4.)가 세워지는 계기가 됐어요. 일제는 무단 통치를 문화 통치로 바꿨어요."],

[3,"01","(가)에 들어갈 왕으로 옳은 것은?\n\n(가) 은(는) 율령을 반포하고 태학을 설립하여 나라의 체제를 정비하였다. 또한 불교를 받아들였다.","소수림왕",["광개토 대왕","장수왕","영양왕","보장왕"],"📜 소수림왕 = 고구려 체제 정비의 3종 세트! 율령 + 태학 + 불교 수용(372~373)."],
[3,"02","밑줄 친 '왕'의 업적으로 옳은 것은?\n\n왕이 도읍을 사비로 옮기고 국호를 남부여로 고쳤다. 이후 신라와 함께 한강 유역을 되찾았으나 관산성에서 전사하였다.","사비로 천도하고 국호를 남부여로 하였다.",["고구려 평양성을 공격하여 고국원왕을 전사시켰다.","웅진에서 즉위하여 22담로에 왕족을 보냈다.","왜에 칠지도를 하사하였다.","신라와 결혼 동맹을 맺고 대야성을 공격하였다."],"🏛️ 사비 천도 + 국호 남부여 + 관산성 전사 = 백제 성왕! 칠지도·평양성 공격은 근초고왕, 22담로는 무령왕이에요."],
[3,"03","(가) 왕에 대한 설명으로 옳은 것은?\n\n이차돈의 순교를 계기로 (가) 은(는) 불교를 공인하였다.","율령을 반포하고 병부를 설치하였다.",["대가야를 정복하고 순수비를 세웠다.","국호를 신라로 정하고 왕의 칭호를 사용하였다.","황룡사 9층 목탑을 세웠다.","당과 연합하여 백제를 멸망시켰다."],"🕯️ 이차돈 순교 → 불교 공인 = 법흥왕! 율령·병부·금관가야 병합도 법흥왕 업적이에요."],
[3,"04","다음 정책을 실시한 통일 신라의 왕은?\n\n· 9주 5소경 설치\n· 관료전 지급, 녹읍 폐지\n· 국학 설립","신문왕",["무열왕","문무왕","원성왕","경덕왕"],"🏯 신문왕 = 통일 후 왕권 강화! 귀족의 녹읍을 없애고 관료전을 줬어요."],
[3,"05","(가)에 들어갈 왕으로 옳은 것은?\n\n최승로가 올린 시무 28조를 받아들인 (가) 은(는) 12목에 지방관을 파견하고 국자감을 정비하였다.","성종",["태조","광종","현종","숙종"],"🏛️ 최승로 시무 28조 + 12목 + 국자감 = 고려 성종! 유교 정치가 자리 잡았어요."],
[3,"06","(가)에 들어갈 문화유산은?\n\n(가) 은(는) 몽골의 침입을 부처의 힘으로 물리치고자 만든 것으로, 현재 합천 해인사에 보관되어 있다.","팔만대장경",["초조대장경","직지심체요절","무구정광대다라니경","동의보감"],"📚 몽골 침입 때 만든 해인사 팔만대장경(재조대장경)! 거란 침입 때 만든 것은 초조대장경이에요."],
[3,"07","(가) 왕 재위 시기의 사실로 옳은 것은?\n\n(가) 은(는) 『경국대전』을 완성·반포하여 통치 체제를 완비하였다.","홍문관을 설치하여 학술 연구와 자문을 맡게 하였다.",["훈민정음을 창제하였다.","6조 직계제를 실시하였다.","직전법을 처음 실시하였다.","균역법을 시행하였다."],"📘 경국대전 완성 = 성종! 홍문관 설치·『동국여지승람』 편찬도 성종 때예요. 훈민정음은 세종, 직전법은 세조예요."],
[3,"08","다음 내용을 담은 제도는?\n\n· 집집마다 토산물로 내던 공납을 쌀, 베, 동전으로 내게 함\n· 선혜청에서 담당\n· 광해군 때 경기도에서 처음 실시","대동법",["영정법","균역법","직전법","과전법"],"🌾 공납을 쌀로! = 대동법. 땅이 많은 사람이 더 많이 내서 농민 부담이 줄었어요."],
[3,"09","다음 책을 편찬하게 한 조선의 왕은?\n\n『농사직설』, 『칠정산』, 『향약집성방』","세종",["태종","세조","성종","정조"],"🌱 농사직설(농서)·칠정산(역법)·향약집성방(의서) = 세종 때 과학·실용 서적!"],
[3,"10","(가) 사건의 결과로 옳은 것은?\n\n(가) 구식 군인들이 월급으로 받은 쌀에 모래가 섞여 있자 이에 반발하여 봉기하였다.","청군이 조선에 주둔하며 간섭이 심해졌다.",["급진 개화파가 우정총국에서 정변을 일으켰다.","전주 화약이 체결되었다.","을사늑약이 체결되었다.","독립 협회가 창립되었다."],"🪖 구식 군인 차별 = 임오군란(1882)! 청군이 들어와 간섭이 심해졌어요. 우정총국 정변은 갑신정변이에요."],
[3,"11","(가) 운동에 대한 설명으로 옳은 것은?\n\n전봉준이 고부에서 봉기하여 (가) 이(가) 시작되었다. 농민군은 전주성을 점령한 뒤 전주 화약을 맺었다.","전주 화약 이후 집강소를 설치하여 폐정 개혁을 추진하였다.",["보안회를 조직하여 황무지 개간권 요구를 막았다.","만민 공동회를 열어 이권 수호를 주장하였다.","국채 보상 운동을 전개하였다.","독립문을 세웠다."],"🌾 고부 봉기 + 전주 화약 = 동학 농민 운동(1894)! 집강소에서 직접 개혁을 실천했어요."],
[3,"12","(가) 단체에 대한 설명으로 옳은 것은?\n\n(가) 은(는) 서재필 등이 조직하여 독립문을 세우고 만민 공동회를 개최하였다.","헌의 6조를 결의하여 고종에게 올렸다.",["비밀 결사로 105인 사건의 배경이 되었다.","민족 유일당 운동으로 결성되었다.","백정의 신분 해방을 목표로 하였다.","한글 맞춤법 통일안을 제정하였다."],"📰 독립신문·독립문·만민 공동회 = 독립 협회(1896)! 의회 설립을 위한 헌의 6조를 결의했어요."],
[3,"13","1948년 5·10 총선거에 대한 설명으로 옳은 것은?","만 21세 이상의 남녀에게 선거권이 주어졌다.",["남북한 전 지역에서 실시되었다.","국민이 대통령을 직접 선출하였다.","김구와 김규식 등이 적극 참여하였다.","남자에게만 투표권을 주었다."],"🗳️ 5·10 총선거 = 남한만 실시, 만 21세 이상 남녀 보통 선거! 제헌 국회가 구성되어 헌법을 만들었어요."],

[4,"01","(가) 왕의 업적으로 옳은 것은?\n\n(가) 은(는) 고구려 평양성을 공격하여 고국원왕을 전사시켰다. 또한 왜에 칠지도를 보냈다.","마한을 정복하고 영토를 크게 넓혔다.",["사비로 도읍을 옮겼다.","22담로에 왕족을 파견하였다.","관산성에서 전사하였다.","대야성을 공격하였다."],"🗡️ 평양성 공격 + 칠지도 = 백제 근초고왕! 전성기에 마한을 정복했어요."],
[4,"02","(가) 왕 재위 시기의 사실로 옳은 것은?\n\n(가) 은(는) 평양으로 도읍을 옮기고 남진 정책을 추진하였다. 광개토 대왕릉비를 세웠다.","백제의 수도 한성을 함락하고 개로왕을 죽였다.",["살수에서 수의 군대를 물리쳤다.","태학을 설립하였다.","연개소문이 정변을 일으켰다.","안시성에서 당군을 물리쳤다."],"🏹 평양 천도 + 남진 = 장수왕! 475년 한성을 함락해 백제는 웅진으로 옮겨요."],
[4,"03","다음 제도를 실시한 통일 신라의 왕은?\n\n·  독서삼품과를 실시하여 유학 능력에 따라 관리를 뽑으려 하였다.","원성왕",["신문왕","경덕왕","진성여왕","헌덕왕"],"📚 독서삼품과(788) = 원성왕! 골품제 때문에 큰 효과는 못 봤어요."],
[4,"04","(가)~(다)를 일어난 순서대로 나열한 것은?\n\n(가) 왕건이 고려를 건국하였다.\n(나) 견훤이 후백제를 세웠다.\n(다) 고려가 신검의 군대를 격파하고 후삼국을 통일하였다.","(나)-(가)-(다)",["(가)-(나)-(다)","(다)-(나)-(가)","(가)-(다)-(나)","(다)-(가)-(나)"],"🔢 후백제 건국(900) → 고려 건국(918) → 후삼국 통일(936)!"],
[4,"05","(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) 은(는) 거란의 소손녕과 외교 담판을 벌여 강동 6주를 확보하였다.","서희",["강감찬","윤관","김부식","최무선"],"🗣️ 말로 이긴 외교관 서희! 강감찬은 귀주 대첩, 윤관은 별무반·동북 9성이에요."],
[4,"06","다음 사실이 있었던 시기에 일어난 일로 옳은 것은?\n\n윤관의 건의로 별무반이 편성되고, 여진을 정벌하여 동북 9성을 쌓았다.","숙종 때 해동통보가 만들어졌다.",["광종이 노비안검법을 실시하였다.","성종이 12목을 설치하였다.","공민왕이 쌍성총관부를 수복하였다.","최충헌이 교정도감을 설치하였다."],"🏹 별무반(숙종, 1104) 시기! 숙종은 해동통보를 만들고 남경(한양)을 중시했어요."],
[4,"07","무신 집권기의 사실로 옳은 것은?","최충헌이 교정도감을 설치하여 권력을 행사하였다.",["묘청이 서경 천도를 주장하였다.","노비안검법이 시행되었다.","쌍성총관부를 수복하였다.","별무반이 조직되었다."],"⚔️ 무신 정변(1170) 이후 최충헌은 교정도감으로 국정을 장악했어요. 묘청은 정변 전, 별무반은 숙종 때예요."],
[4,"08","(가) 부대에 대한 설명으로 옳은 것은?\n\n(가) 은(는) 배중손의 지휘 아래 개경 환도에 반대하며 진도로 옮겨 몽골에 항전하였다.","삼별초",["별무반","광군","훈련도감","장용영"],"🛡️ 개경 환도(1270)에 반대한 삼별초! 진도 → 제주도로 옮겨 싸웠어요."],

function cmxWrap(t,n){
  const out=[];
  t.split('|').forEach(seg=>{
    let cur='';
    for(const w of seg.split(' ')){
      const nx=cur?cur+' '+w:w;
      if([...nx].length>n&&cur){out.push(cur);cur=w}else cur=nx;
    }
    if(cur)out.push(cur);
  });
  const res=[];
  out.forEach(l=>{while([...l].length>n+2){res.push([...l].slice(0,n).join(''));l=[...l].slice(n).join('')}res.push(l)});
  return res.slice(0,3);
}
function cmxSvg(panels){
  const bg=['#fef3c7','#dbeafe','#dcfce7'];
  let h='';
  panels.forEach((p,i)=>{
    const x=4+i*98,e=p[0],len=e.length,fs=len<=3?46:len<=5?34:len<=7?24:18;
    h+='<rect x="'+x+'" y="4" width="92" height="124" rx="10" fill="'+bg[i]+'" stroke="#222" stroke-width="2.5"/>'
      +'<circle cx="'+(x+13)+'" cy="17" r="9" fill="#222"/><text x="'+(x+13)+'" y="21" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">'+(i+1)+'</text>'
      +'<text x="'+(x+46)+'" y="'+(62+(fs>40?4:0))+'" font-size="'+fs+'" text-anchor="middle">'+e+'</text>'
      +cmxWrap(p[1],7).map((l,j)=>'<text x="'+(x+46)+'" y="'+(92+j*13)+'" font-size="11.5" font-weight="bold" fill="#222" text-anchor="middle">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>').join('');
    if(i<2)h+='<polygon points="'+(x+93)+',58 '+(x+99)+',66 '+(x+93)+',74" fill="#e11d48"/>';
  });
  return '<svg viewBox="0 0 300 132" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">'+h+'</svg>';
}

function keEra(t){
  for(const k in KE_MAP){if(KE_MAP[k].split(',').includes(t))return +k}
  return -1;
}
function keStrip(era){
  let h='';const w=300/7;
  for(let i=0;i<7;i++){
    const x=i*w+2,on=i===era;
    h+='<rect x="'+x+'" y="'+(on?2:8)+'" width="'+(w-4)+'" height="'+(on?36:30)+'" rx="6" fill="'+(on?'#fde047':'#e5e7eb')+'" stroke="'+(on?'#e11d48':'#9ca3af')+'" stroke-width="'+(on?3:1.5)+'"/>';
    const ls=KE_ERA[i].split('|');
    ls.forEach((l,j)=>{h+='<text x="'+(x+(w-4)/2)+'" y="'+((on?18:22)+(ls.length>1?(j*10-4):0))+'" font-size="'+(ls.length>1?8.5:10.5)+'" font-weight="bold" fill="#222" text-anchor="middle">'+l+'</text>'});
    h+='<text x="'+(x+(w-4)/2)+'" y="'+(on?36:41)+'" font-size="6.5" fill="#555" text-anchor="middle">'+KE_YR[i]+'</text>';
  }
  h+='<text x="'+(era*w+w/2)+'" y="56" font-size="11" text-anchor="middle">📍</text>';
  return h;
}
function keSvg(era,comic){
  const inner=s=>s.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  const sT=keStrip(era);
  if(!comic)return '<svg viewBox="0 0 300 66" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">'+sT+'</svg>';
  return '<svg viewBox="0 0 300 202" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">'+inner(cmxSvg(comic))+'<g transform="translate(0,134)">'+sT+'</g></svg>';
}

function sqBuildRandom(){
  const subs=['국어','사회','과학','한국사'],high=SQ.rl==='high',total=30;
  const extra=shuffle(subs.slice()).slice(0,2),jobs=[];
  subs.forEach(s=>{const n=7+(extra.includes(s)?1:0);
    if(high){const h=Math.ceil(n/2);jobs.push([s,h,5],[s,n-h,4])}else jobs.push([s,n,3])});
  let items=[];const seen=new Set();
  const add=(s,n,L)=>{SQ.sub=s;SQ.lv=L;SQN=n;sqBuild();SQ.items.forEach(q=>{const k=s+'|'+q.t;if(!seen.has(k)){seen.add(k);items.push(q)}})};
  jobs.forEach(j=>add(j[0],j[1],j[2]));
  let g=0;
  while(items.length<total&&g<12){add(subs[g%4],Math.min(6,total-items.length),high?5:3);g++}
  SQN=10;SQ.sub='랜덤';SQ.lv=high?5:3;
  items=shuffle(items).slice(0,total);
  SQ.items=items;SQ.i=0;SQ.right=0;SQ.done=false;SQ.wrongs=[];SQ.phase='main';SQ.review=false;SQ.mainN=items.length;SQ.rright=0;SQ.rres={};
}
function sqClear(q){
  if(q.src==='w'){delete notes[q.t];store.set('wb_notes',notes)}
  else if(q.src==='h'){delete hnotes[q.t];store.set('wb_hnotes',hnotes)}
  else{delete SQN_NOTES[q.t];store.set('wb_sqnotes',SQN_NOTES)}
}
function sqMixReview(){
  const c=[];
  Object.keys(SQN_NOTES).forEach(t=>{
    const e=SQN_NOTES[t];
    if(e.ex&&SQEK[t]){const x=SQEK[t];c.push({n:e.n,it:{t,d:x[2],lv:x[0],sub:'한국사',again:false,ex:true,a:x[3],opts:shuffle([x[3]].concat(x[4]))}});return}
    const all=sqPool(e.sub),a=all.find(x=>x[0]===t);if(!a)return;
    const bad=x=>x[0]!==a[0]&&!a[1].includes(x[0])&&!x[1].includes(a[0]);
    const n4=e.sub==='한국사'?4:3;
    const d=shuffle(all.filter(x=>bad(x)&&x[2]===a[2])).concat(shuffle(all.filter(x=>bad(x)&&x[2]!==a[2]))).slice(0,n4).map(x=>x[0]);
    c.push({n:e.n,it:{t,d:a[1],lv:a[3],sub:e.sub,again:false,opts:shuffle([t].concat(d))}});
  });
  Object.keys(notes).forEach(k=>{
    const w=WORDS.find(x=>x[0]===k);if(!w)return;
    const d=shuffle(WORDS.filter(x=>x[0]!==k&&Math.abs(x[2]-w[2])<=1)).slice(0,3).map(x=>x[0]);
    c.push({n:notes[k],it:{t:k,d:w[1],lv:w[2],sub:'단어',src:'w',again:false,opts:shuffle([k].concat(d))}});
  });
  Object.keys(hnotes).forEach(k=>{
    const w=HJW.find(x=>x.k===k);if(!w)return;
    const d=shuffle(HJW.filter(x=>x.k!==k)).slice(0,3).map(x=>x.k);
    c.push({n:hnotes[k],it:{t:k,d:w.m,lv:1,sub:'한자',src:'h',again:false,opts:shuffle([k].concat(d))}});
  });
  if(!c.length)return false;
  c.forEach(x=>{x.r=Math.random()});
  c.sort((a,b)=>b.n-a.n||a.r-b.r);
  const seen=new Set(),items=[];
  for(const x of c){if(items.length>=30)break;if(seen.has(x.it.t))continue;seen.add(x.it.t);x.it.wn=x.n;items.push(x.it)}
  show('sheet');
  SQ.mix=true;SQ.items=items;SQ.i=0;SQ.right=0;SQ.rright=0;SQ.rres={};SQ.wrongs=[];SQ.done=false;SQ.phase='retry';SQ.review=true;SQ.mainN=items.length;
  sqAsk();
  return true;
}

function sqAnswer(v){
  if(SQ.done)return;
  const q=SQ.items[SQ.i];
  let ok,picked;
  const M=sqM(q),ans=q.ex?q.a:q.t;
  if(M==='choice'){picked=q.opts[v];ok=picked===ans}
  else{
    if(sqNorm(v)==='')return;
    picked=String(v).trim();ok=sqNorm(picked)===sqNorm(q.t);
  }
  SQ.done=true;
  wonAdd(SQ.phase!=='main',ok);
  if(SQ.phase==='main'){
    if(ok){SQ.right++;quizFx(true)}else{SQ.wrongs.push(q);quizFx(false)}
  }else{
    SQ.rres[q.t]=ok;
    if(ok){SQ.rright++;quizFx(true);if(SQ.review)sqClear(q)}else quizFx(false);
  }
  if(!q.src)sqWMark(q.t,ok,SQ.phase);
  if(!ok&&q.src==='w'){notes[q.t]=(notes[q.t]||0)+1;store.set('wb_notes',notes)}
  else if(!ok&&q.src==='h'){hnotes[q.t]=(hnotes[q.t]||0)+1;store.set('wb_hnotes',hnotes)}
  else if(!ok){const e=SQN_NOTES[q.t]||{n:0};e.sub=q.sub||SQ.sub;e.d=q.d;if(q.ex){e.ex=1;e.a=q.a}e.n++;e.last=sqToday();SQN_NOTES[q.t]=e;store.set('wb_sqnotes',SQN_NOTES)}
  sqCount(ok);
  // 화면 표시
  if(M==='choice'){
    [...$('sqo').children].forEach((b,j)=>{b.disabled=true;if(q.opts[j]===ans){b.classList.add('right');ringOn(b)}else if(j===v)b.classList.add('wrong')});
  }else{
    const inp=$('sqin');inp.disabled=true;inp.classList.add(ok?'okin':'badin');$('sqCheck').style.display='none';
  }
  const x=SQH[q.t]||(q.src?sqExt(q):['','','']);
  let h='<div class="sqfb '+(ok?'good':'bad')+'">';
  h+='<div class="sqres">'+(ok?'⭕ 정답이에요! 👏':'❌ 아쉬워요! 정답은 「'+esc(ans)+'」')+'</div>';
  if(!ok)h+='<div class="sqcheer">'+SQ_CHEER[Math.floor(Math.random()*SQ_CHEER.length)]+'</div>';
  if(ok)h+='<div class="sqsec"><b>정답</b> 「'+esc(ans)+'」'+(q.ex?'':' = '+esc(q.d))+'</div>';
  if(x[0])h+='<div class="sqsec">📖 <b>한자 뜻</b><br><span class="sqhj">'+esc(x[0])+'</span> &nbsp;'+esc(x[1])+'</div>';
  h+='<div class="sqsec">'+(q.ex?'📚 <b>해설</b>':'🧑‍🎮 <b>쉬운 풀이</b>')+'<br>'+esc(x[2]).replace(/&lt;(.*?)&gt;/g,'<b>$1</b>')+'</div>';
  {
    const fa=sqFig(q.t,q.ex?'🕒 시간 순서':'⭕ 정답 「'+esc(ans)+'」'),fb=(!ok&&M==='choice'&&picked&&picked!==ans)?sqFig(picked,'❌ 내가 고른 「'+esc(picked)+'」',true):'';
    if(fa||fb)h+='<div class="sqsec">🖼️ <b>그림으로 보기</b><div class="sqimgs">'+fa+fb+'</div></div>';
  }
  if(!ok){
    const pd=sqDef(picked);
    let why;
    if(q.ex)why=pd?'내가 고른 「'+esc(picked)+'」은(는) <b>'+esc(pd)+'</b> 를 뜻해요. 그런데 이 문제의 조건에 맞는 것은 「'+esc(ans)+'」이에요. 해설을 다시 읽어 봐요!':'내가 고른 「'+esc(picked)+'」은(는) 문제의 조건과 맞지 않아요. 정답은 「'+esc(ans)+'」이에요. 아래 해설을 확인해 봐요!';
    else if(pd)why='내가 고른 「'+esc(picked)+'」은(는) <b>'+esc(pd)+'</b> 라는 뜻이에요. 그런데 이 문제는 <b>'+esc(q.d)+'</b> 를 묻고 있어서, 정답은 「'+esc(q.t)+'」이에요.';
    else why='내가 쓴 「'+esc(picked)+'」은(는) 정답과 달라요. 문제의 뜻 <b>'+esc(q.d)+'</b> 에 맞는 낱말은 「'+esc(q.t)+'」이에요. 글자를 다시 확인해 보세요!';
    h+='<div class="sqsec">🤔 <b>왜 틀렸을까?</b><br>'+why+'</div>';
  }
  if(M==='choice'){
    h+='<div class="sqsec">📋 <b>보기'+(q.ex?' 살펴보기':'의 뜻')+'</b>'+q.opts.map(o=>'<div class="sqopt'+(o===ans?' c':'')+'">'+(o===ans?'✅ ':(o===picked?'❌ ':'• '))+'<b>'+esc(o)+'</b>'+(sqDef(o)&&!q.ex?' : '+esc(sqDef(o)):(q.ex&&sqDef(o)?' : '+esc(sqDef(o)):''))+'</div>').join('')+'</div>';
  }
  h+='</div>';
  $('sqFb').innerHTML=h;
  sqFoot();
  const sb=$('sqSubmit');sb.style.display='';
  sb.textContent=SQ.i+1>=SQT()?((SQ.phase==='main'&&SQ.wrongs.length)?'틀린 문제 다시 풀기 🔁 ('+SQ.wrongs.length+'개)':'결과 보기 🏁'):'다음 문제 ▶';
  sb.onclick=sqNext;
  setTimeout(()=>{const f=$('sqFb');if(f&&f.scrollIntoView&&SQ.done)f.scrollIntoView({behavior:'smooth',block:'nearest'})},1300);
}
function sqNext(){
  if(!SQ.done)return;
  SQ.i++;
  if(SQ.i>=SQT()){
    if(SQ.phase==='main'&&!SQ.review&&SQ.sub==='랜덤'&&SQ.rl==='high')msAdd('sheet');
    if(SQ.phase==='main'&&SQ.wrongs.length)sqRetry();else sqResult();
  }else sqAsk();
}

function sqNotesReview(){
  SQ.mix=false;
  const keys=shuffle(Object.keys(SQN_NOTES)).slice(0,10);
  const items=[];
  keys.forEach(t=>{
    const e=SQN_NOTES[t],all=sqPool(e.sub);
    if(e.ex&&SQEK[t]){const x=SQEK[t];items.push({t,d:x[2],lv:x[0],sub:'한국사',again:false,ex:true,a:x[3],opts:shuffle([x[3]].concat(x[4]))});return}
    const a=all.find(x=>x[0]===t);
    if(!a)return;
    const bad=x=>x[0]!==a[0]&&!a[1].includes(x[0])&&!x[1].includes(a[0]);
    const d=shuffle(all.filter(x=>bad(x)&&x[2]===a[2])).concat(shuffle(all.filter(x=>bad(x)&&x[2]!==a[2]))).slice(0,3).map(x=>x[0]);
    items.push({t,d:a[1],lv:a[3],sub:e.sub,again:false,opts:shuffle([t].concat(d))});
  });
  if(!items.length)return;
  show('sheet');
  SQ.items=items;SQ.i=0;SQ.right=0;SQ.rright=0;SQ.rres={};SQ.wrongs=[];SQ.done=false;SQ.phase='retry';SQ.review=true;SQ.mainN=items.length;
  sqAsk();
}
function sqRetry(){
  SQ.phase='retry';
  SQ.items=SQ.wrongs.map(q=>({t:q.t,d:q.d,lv:q.lv,sub:q.sub,ex:q.ex,a:q.a,again:false,opts:shuffle(q.opts.slice())}));
  SQ.i=0;SQ.rright=0;SQ.rres={};SQ.done=false;
  const box=$('sqBody');box.scrollTop=0;
  box.innerHTML='<div class="sqi" style="text-align:center"><div style="font-size:clamp(20px,3.4vw,26px)">🔁 틀린 문제 다시 풀기!</div><div class="sqq" style="margin-top:10px">방금 틀린 <b style="font-size:18px">'+SQ.items.length+'문제</b>를 한 번 더 풀어 봐요.<br>해설을 떠올리면 이번엔 맞힐 수 있어요! 💪</div></div>';

// 틀린 단어만 다시 풀기 (뜻 보고 낱말 고르기)
const R={list:[],i:0,right:0,done:false};
function startWordReview(){
  const ws=Object.keys(notes).map(k=>WORDS.find(x=>x[0]===k)).filter(Boolean);
  if(!ws.length)return;
  R.list=shuffle(ws.slice());R.i=0;R.right=0;
  reviewAsk();
}
function reviewAsk(){
  if(R.i>=R.list.length){
    msAdd('review');
    $('qText').textContent='복습 끝! 🎉';
    $('qSub').textContent='';
    $('qChoices').innerHTML='';
    $('qFb').innerHTML='틀린 단어 '+R.list.length+'개 중 <b style="color:#f5cd30">'+R.right+'개</b> 맞혔어요!<br>맞힌 단어는 오답노트에서 줄어들어요 ✅<br><button class="btn y" id="qBack" style="margin-top:12px">오답노트로</button>';
    $('qBack').onclick=()=>{$('quiz').classList.remove('on');renderNotes()};
    return;
  }
  const w=R.list[R.i];R.done=false;
  const opts=[w];
  while(opts.length<4){const c=WORDS[Math.floor(Math.random()*WORDS.length)];if(!opts.includes(c))opts.push(c)}
  shuffle(opts);
  $('qText').textContent='「'+w[1]+'」';
  $('qSub').textContent='이 뜻에 맞는 낱말은? ('+(R.i+1)+' / '+R.list.length+')';
  const box=$('qChoices');box.innerHTML='';$('qFb').textContent='';
  const btns=[];
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='btn choice';b.textContent=o[0];
    b.onclick=()=>{
      if(R.done)return;R.done=true;
      const ok=(o===w);
      btns.forEach((bb,j)=>{if(opts[j]===w){bb.classList.add('right');ringOn(bb)}});
      if(!ok)b.classList.add('wrong');
      recordResult(w,ok);wonAdd(true,ok);
      if(ok){R.right++;delete notes[w[0]];store.set('wb_notes',notes);quizFx(true)}else quizFx(false);
      $('qFb').innerHTML=(ok?'⭕ 정답! ':'❌ 정답은 ')+'<b style="color:#f5cd30">'+w[0]+'</b> = '+w[1]+wInfo(w[0])+'<br><button class="btn g" id="qNext" style="margin-top:10px">다음 ▶</button>';
      $('qNext').onclick=()=>{R.i++;reviewAsk()};
    };
    box.appendChild(b);btns.push(b);
  });
  $('quiz').classList.add('on');
}
function startHanjaReview(){
  const ws=Object.keys(hnotes).map(k=>HJW.find(x=>x.k===k)).filter(Boolean);
  if(!ws.length)return;
  startHanja(1,ws);
}
function renderNotes(){
  $('tabM').className='btn '+(notesTab==='mix'?'y':'');
  $('tabW').className='btn '+(notesTab==='wrong'?'y':'');
  $('tabA').className='btn '+(notesTab==='all'?'y':'');
  $('tabQ').className='btn '+(notesTab==='quiz'?'y':'');
  $('nMsg').textContent='';
  const box=$('nBody');box.innerHTML='';
  if(notesTab==='mix'){
    const wk=Object.keys(notes).filter(k=>WORDS.find(x=>x[0]===k)),hk=Object.keys(hnotes).filter(k=>HJW.find(x=>x.k===k)),qk=Object.keys(SQN_NOTES);
    const tot=wk.length+hk.length+qk.length;
    if(!tot){box.innerHTML='<div class="empty">아직 틀린 문제가 없어요! 👍<br>게임·쪽지시험에서 틀린 문제가 모두 여기에 모여요.</div>';return}
    box.appendChild(reviewBtn('📝 틀린 문제만 모아 쪽지시험 보기 (30개 · 많이 틀린 순)',()=>sqMixReview()));
    const sum=document.createElement('div');sum.className='nhead';sum.textContent='📚 틀린 문제 모두 '+tot+'개 (🧱 단어 '+wk.length+' · 🈶 한자 '+hk.length+' · 📝 쪽지시험 '+qk.length+')';box.appendChild(sum);
    const sec=(title,cnt,label,fn)=>{
      const hd=document.createElement('div');hd.className='nhead';hd.textContent=title+' ('+cnt+'개)';box.appendChild(hd);
      if(fn)box.appendChild(reviewBtn(label,fn));
    };
    const row=(w,m,c,del)=>{
      const d=document.createElement('div');d.className='wcard';
      d.innerHTML='<div class="w" style="min-width:110px">'+w+'</div><div class="m">'+m+'<div class="c">'+c+'</div></div>';
      const b=document.createElement('button');b.className='btn sm g';b.textContent='외웠어요';b.onclick=del;
      d.appendChild(b);box.appendChild(d);
    };
    if(wk.length){sec('🧱 단어 게임 (드롭·버블)',wk.length,'🔁 단어 틀린 문제 다시 하기',startWordReview);
      wk.forEach(k=>{const w=WORDS.find(x=>x[0]===k);row(esc(w[0]),esc(w[1]),'틀린 횟수 '+notes[k],()=>{delete notes[k];store.set('wb_notes',notes);renderNotes()})})}
    if(hk.length){sec('🈶 한자 퀴즈',hk.length,'🔁 한자 틀린 문제 다시 하기',startHanjaReview);
      hk.forEach(k=>{const w=HJW.find(x=>x.k===k);row(w.k,w.m,'틀린 횟수 '+hnotes[k],()=>{delete hnotes[k];store.set('wb_hnotes',hnotes);renderNotes()})})}
    if(qk.length){sec('📝 단어 쪽지시험 (국어·사회·과학·한국사·랜덤)',qk.length,'🔁 쪽지시험 틀린 문제 다시 하기 ('+Math.min(10,qk.length)+'문제)',sqNotesReview);
      qk.forEach(k=>{const e=SQN_NOTES[k];row(esc(e.ex?'정답 : '+e.a:k),'['+esc(e.sub)+'] '+esc(e.d).replace(/\n/g,'<br>'),'틀린 횟수 '+e.n+(e.last?' · 최근 '+e.last:''),()=>{delete SQN_NOTES[k];store.set('wb_sqnotes',SQN_NOTES);renderNotes()})})}
    return;
  }
  if(notesTab==='quiz'){
    const qk=Object.keys(SQN_NOTES);
    if(!qk.length){box.innerHTML='<div class="empty">아직 틀린 쪽지시험 문제가 없어요! 👍<br>쪽지시험에서 틀리면 모두 여기에 기록돼요.</div>';return}
    box.appendChild(reviewBtn('🔁 틀린 문제만 다시 하기 ('+Math.min(10,qk.length)+'문제)',sqNotesReview));
    const by={};qk.forEach(k=>{const e=SQN_NOTES[k];(by[e.sub]=by[e.sub]||[]).push(k)});
    Object.keys(SQD).forEach(sub=>{
      if(!by[sub])return;
      const hd=document.createElement('div');hd.className='nhead';hd.textContent='📝 '+sub+' ('+by[sub].length+'개)';box.appendChild(hd);
      by[sub].forEach(k=>{
        const e=SQN_NOTES[k],x=SQH[k]||['','',''];
        const d=document.createElement('div');d.className='wcard';
        d.innerHTML='<div class="w" style="min-width:110px">'+esc(e.ex?'정답 : '+e.a:k)+'</div><div class="m">'+esc(e.d).replace(/\n/g,'<br>')+(x[0]?'<div class="c" style="color:#9fe">📖 '+esc(x[0])+' · '+esc(x[1])+'</div>':'')+'<div class="exp">🧑‍🎮 <b>쉬운 풀이</b><br>'+esc(x[2])+'</div>'+(sqFig(k)?'<div class="sqimgs">'+sqFig(k)+'</div>':'')+'<div class="c">틀린 횟수 '+e.n+(e.last?' · 최근 '+e.last:'')+'</div></div>';
        const b=document.createElement('button');b.className='btn sm g';b.textContent='외웠어요';
        b.onclick=()=>{delete SQN_NOTES[k];store.set('wb_sqnotes',SQN_NOTES);renderNotes()};
        d.appendChild(b);box.appendChild(d);
      });
    });
    return;
  }
  if(notesTab==='hanja'){
    const hk=Object.keys(hnotes).filter(k=>HJW.find(x=>x.k===k));
    if(!hk.length){box.innerHTML='<div class="empty">아직 틀린 한자어가 없어요! 👍<br>한자 퀴즈에서 틀리면 여기에 모여요.</div>';return}
    box.appendChild(reviewBtn('🔁 틀린 문제만 다시 하기 ('+hk.length+'개)',startHanjaReview));
    hk.forEach(k=>{
      const w=HJW.find(x=>x.k===k);
      const d=document.createElement('div');d.className='wcard';
      d.innerHTML='<div class="w" style="min-width:110px">'+w.k+'</div><div class="m">'+w.m+wInfo(k)+'<div class="c">틀린 횟수 '+hnotes[k]+'</div></div>';
      const b=document.createElement('button');b.className='btn sm g';b.textContent='외웠어요';
      b.onclick=()=>{delete hnotes[k];store.set('wb_hnotes',hnotes);renderNotes()};
      d.appendChild(b);box.appendChild(d);
    });
    return;
  }
  if(notesTab==='wrong'){
    const keys=Object.keys(notes).filter(k=>WORDS.find(x=>x[0]===k));
    if(!keys.length){box.innerHTML='<div class="empty">아직 틀린 단어가 없어요! 👍<br>게임을 하다 틀리면 여기에 모여요.</div>';return}
    box.appendChild(reviewBtn('🔁 틀린 문제만 다시 하기 ('+keys.length+'개)',startWordReview));
    keys.forEach(k=>{
      const w=WORDS.find(x=>x[0]===k);
      const d=document.createElement('div');d.className='wcard';
      d.innerHTML='<div class="w">'+w[0]+'</div><div class="m">'+w[1]+wInfo(k)+'<div class="c">틀린 횟수 '+notes[k]+'</div></div>';
      const b=document.createElement('button');b.className='btn sm g';b.textContent='외웠어요';
      b.onclick=()=>{delete notes[k];store.set('wb_notes',notes);renderNotes()};
      d.appendChild(b);box.appendChild(d);
    });
  }else{
    WORDS.slice().sort((a,b)=>a[2]-b[2]).forEach(w=>{
      const d=document.createElement('div');d.className='wcard';
      d.innerHTML='<div class="w">'+w[0]+'</div><div class="m">'+w[1]+'<div class="c" style="color:#9fe">Lv.'+w[2]+'</div></div>';
      box.appendChild(d);
    });
  }
}
$('tabM').onclick=()=>{notesTab='mix';renderNotes()};
$('tabW').onclick=()=>{notesTab='wrong';renderNotes()};
$('tabA').onclick=()=>{notesTab='all';renderNotes()};
$('tabQ').onclick=()=>{notesTab='quiz';renderNotes()};


/* ===== 오답노트 인쇄 ===== */
function pData(){
  const o={q:{},w:[],h:[]};
  Object.keys(SQN_NOTES).forEach(t=>{const e=SQN_NOTES[t];(o.q[e.sub]=o.q[e.sub]||[]).push({t:e.ex?e.a:t,d:e.d,n:e.n,x:SQH[t]||['','','']})});
  Object.keys(notes).forEach(k=>{const w=WORDS.find(x=>x[0]===k);if(!w)return;const j=HJW.find(x=>x.k===k);
    o.w.push({t:k,d:w[1],n:notes[k],hj:j?j.h:'',hh:j?j.p.map((c,i)=>[...j.k][i]+' : '+c[1]).join(', '):'',e:j?j.e:''})});
  Object.keys(hnotes).forEach(k=>{const j=HJW.find(x=>x.k===k);if(!j)return;
    o.h.push({t:k,d:j.m,n:hnotes[k],hj:j.h,hh:j.p.map((c,i)=>[...j.k][i]+' : '+c[1]).join(', '),e:j.e})});
  return o;
}
function pToday(){const d=new Date();return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'}
function pRows(list,kind){
  return '<table><tr><th class="c1">✔</th><th class="c2">낱말</th><th>뜻</th><th>한자 뜻 · 쉬운 풀이</th><th class="c5">틀린<br>횟수</th></tr>'+list.map(r=>{
    let ex='';
    if(kind==='q'){ex=(r.x[0]?'<b>'+esc(r.x[0])+'</b> ('+esc(r.x[1])+')<br>':'')+esc(r.x[2])}
    else ex=(r.hj?'<b>'+esc(r.hj)+'</b> ('+esc(r.hh)+')<br>':'')+esc(r.e||'');
    return '<tr><td class="c1">☐</td><td class="c2"><b>'+esc(r.t)+'</b></td><td>'+esc(r.d)+'</td><td>'+ex+'</td><td class="c5">'+r.n+'</td></tr>';
  }).join('')+'</table>';
}
function buildPrint(mode){
  const o=pData();
  const nq=Object.values(o.q).reduce((a,l)=>a+l.length,0);
  const total=nq+o.w.length+o.h.length;
  if(!total)return false;
  let h='';
  if(mode==='note'){
    h+='<h1>📒 단어 블록 월드 · 오답노트</h1><div class="pmeta">이름: ______________ &nbsp; 날짜: '+pToday()+' &nbsp; 모두 '+total+'개</div>';
    Object.keys(SQD).forEach(sub=>{if(o.q[sub])h+='<h2>📝 쪽지시험 · '+sub+' ('+o.q[sub].length+'개)</h2>'+pRows(o.q[sub],'q')});
    if(o.w.length)h+='<h2>🧱 단어 게임 오답 ('+o.w.length+'개)</h2>'+pRows(o.w,'w');
    if(o.h.length)h+='<h2>🈶 한자 퀴즈 오답 ('+o.h.length+'개)</h2>'+pRows(o.h,'h');
    h+='<div class="pfoot">✔ 칸에 외운 낱말을 체크하세요!</div>';
  }else{
    const items=[];
    Object.keys(SQD).forEach(sub=>{(o.q[sub]||[]).forEach(r=>items.push({tag:sub,t:r.t,d:r.d}))});
    o.w.forEach(r=>items.push({tag:'단어',t:r.t,d:r.d}));
    o.h.forEach(r=>items.push({tag:'한자어',t:r.t,d:r.d}));
    h+='<h1>📝 복습 시험지</h1><div class="pmeta">이름: ______________ &nbsp; 날짜: '+pToday()+' &nbsp; 점수: ______ / '+items.length+'</div>';
    h+='<div class="pguide">뜻을 읽고 알맞은 낱말을 빈칸에 쓰세요.</div>';
    h+=items.map((it,i)=>'<div class="pq"><b>'+(i+1)+'.</b> <span class="ptag">'+esc(it.tag)+'</span> '+esc(it.d)+'<div class="pans">답: ____________________</div></div>').join('');
    h+='<div class="pbreak"></div><h1>✅ 정답</h1><div class="pmeta">'+pToday()+'</div><div class="pa">'+items.map((it,i)=>'<span>'+(i+1)+'. <b>'+esc(it.t)+'</b></span>').join('')+'</div>';
  }
  $('printArea').innerHTML=h;
  return true;
}
function doPrint(mode){
  if(!buildPrint(mode)){$('nMsg').textContent='인쇄할 오답이 아직 없어요! 👍';return}
  $('nMsg').textContent='';
  setTimeout(()=>{try{window.print()}catch(e){$('nMsg').textContent='이 브라우저에서는 인쇄할 수 없어요. 인쇄 메뉴를 직접 열어 주세요.'}},80);
}
$('nPrint1').onclick=()=>doPrint('note');
$('nPrint2').onclick=()=>doPrint('test');

if(window.visualViewport){

    if($('drop').classList.contains('on'))dFit();
    if($('bubble').classList.contains('on'))bFit();

  window.visualViewport.addEventListener('resize',fixVV);
}
refreshHome();
